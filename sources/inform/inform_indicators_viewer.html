<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INFORM Indicators Viewer</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#ffffff; --ink:#1c2430; --muted:#5f6b7a;
    --line:#e4e8ee; --accent:#2563eb; --accent-soft:#e8f0fe;
    --raw:#0e7490; --raw-bg:#e0f2f7; --proxy:#b45309; --proxy-bg:#fdf0dc;
    --agg:#7c3aed; --agg-bg:#efe7fd;
    --shadow:0 1px 3px rgba(20,30,50,.06),0 4px 16px rgba(20,30,50,.05);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0f141b; --panel:#161d27; --ink:#e7ecf3; --muted:#93a1b3;
      --line:#26303d; --accent:#5b8cff; --accent-soft:#1c2740;
      --raw:#4dd0e1; --raw-bg:#123038; --proxy:#e0a352; --proxy-bg:#33260f;
      --agg:#b794f6; --agg-bg:#241a3a;
      --shadow:0 1px 3px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
      --bg:#0f141b; --panel:#161d27; --ink:#e7ecf3; --muted:#93a1b3;
      --line:#26303d; --accent:#5b8cff; --accent-soft:#1c2740;
      --raw:#4dd0e1; --raw-bg:#123038; --proxy:#e0a352; --proxy-bg:#33260f;
      --agg:#b794f6; --agg-bg:#241a3a;
      --shadow:0 1px 3px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       background:var(--bg);color:var(--ink);line-height:1.45;font-size:15px}
  header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);
          padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  header h1{font-size:17px;margin:0;font-weight:650;letter-spacing:-.01em}
  header .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
  .spacer{flex:1}
  button,label.filebtn{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);
          color:var(--ink);padding:8px 14px;border-radius:9px;font-size:13.5px;transition:.15s}
  label.filebtn{background:var(--accent);color:#fff;border-color:transparent;font-weight:600}
  label.filebtn:hover{filter:brightness(1.06)}
  button:hover{border-color:var(--accent)}
  input[type=file]{display:none}
  .wrap{display:flex;min-height:calc(100vh - 60px)}
  aside{width:290px;flex-shrink:0;border-right:1px solid var(--line);background:var(--panel);
        padding:14px 10px;overflow-y:auto;max-height:calc(100vh - 60px);position:sticky;top:60px}
  .grp-title{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
             font-weight:700;margin:14px 8px 6px}
  .dbtn{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;
        border:none;background:transparent;padding:8px 10px;border-radius:8px;margin:1px 0;color:var(--ink)}
  .dbtn:hover{background:var(--accent-soft)}
  .dbtn.active{background:var(--accent);color:#fff}
  .dbtn.active .cnt{background:rgba(255,255,255,.25);color:#fff}
  .dbtn .nm{font-size:13.5px}
  .cnt{font-size:11.5px;background:var(--bg);color:var(--muted);border-radius:20px;padding:1px 8px;font-weight:600}
  main{flex:1;padding:22px 26px;overflow-x:hidden}
  .empty{max-width:520px;margin:8vh auto;text-align:center;color:var(--muted)}
  .empty h2{color:var(--ink);font-weight:650}
  .drop{border:2px dashed var(--line);border-radius:16px;padding:38px 24px;margin-top:20px;transition:.15s}
  .drop.over{border-color:var(--accent);background:var(--accent-soft)}
  .crumb{color:var(--muted);font-size:13px;margin-bottom:2px}
  h2.dt{margin:0 0 4px;font-size:24px;letter-spacing:-.02em}
  .badges{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
  .pill{font-size:12px;padding:3px 10px;border-radius:20px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
  .note{background:var(--accent-soft);border:1px solid var(--line);border-left:3px solid var(--accent);
        padding:10px 14px;border-radius:8px;font-size:13.5px;margin:12px 0;color:var(--ink)}
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:16px 0 8px}
  .search{flex:1;min-width:200px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;
          background:var(--panel);color:var(--ink);font-size:14px}
  .chip{font-size:12.5px;padding:6px 12px;border-radius:20px;border:1px solid var(--line);
        background:var(--panel);color:var(--muted);cursor:pointer;user-select:none}
  .chip.on{background:var(--ink);color:var(--bg);border-color:transparent}
  table{width:100%;border-collapse:collapse;margin-top:8px}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
     padding:8px 10px;border-bottom:2px solid var(--line);position:sticky;top:60px;background:var(--bg)}
  td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top;font-size:13.5px}
  tr:hover td{background:var(--accent-soft)}
  code.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;
            background:var(--bg);padding:2px 6px;border-radius:5px;white-space:nowrap}
  .nm2{font-weight:600}
  .desc{color:var(--muted);font-size:12.5px;margin-top:3px}
  .grp{color:var(--muted);font-size:11.5px;margin-top:4px;font-style:italic}
  .unit{white-space:nowrap;font-size:12.5px}
  .tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;white-space:nowrap;text-transform:uppercase;letter-spacing:.03em}
  .tag.raw{background:var(--raw-bg);color:var(--raw)}
  .tag.aggregated{background:var(--agg-bg);color:var(--agg)}
  .tag.raw_proxy{background:var(--proxy-bg);color:var(--proxy)}
  .count-line{font-size:12.5px;color:var(--muted);margin:6px 2px}
  @media(max-width:820px){
    .wrap{flex-direction:column}
    aside{width:auto;position:static;max-height:none;border-right:none;border-bottom:1px solid var(--line);
          display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:2px}
    .grp-title{grid-column:1/-1}
    th{position:static}
    main{padding:18px 16px}
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>INFORM Indicators Viewer</h1>
    <div class="sub" id="fileInfo">Load a JSON file to begin</div>
  </div>
  <div class="spacer"></div>
  <button id="themeBtn" title="Toggle light/dark">◐ Theme</button>
  <label class="filebtn">Load JSON…<input type="file" id="fileInput" accept=".json,application/json"></label>
</header>

<div class="wrap">
  <aside id="sidebar"></aside>
  <main id="main">
    <div class="empty" id="emptyState">
      <h2>No data loaded yet</h2>
      <p>Open one of the generated files — <b>inform_indicators_by_disaster.json</b> (relevant indicators) or
         <b>inform_indicators_uncertain_review.json</b> (uncertain ones).</p>
      <div class="drop" id="drop">Click <b>“Load JSON…”</b> above, or drag &amp; drop a JSON file here.</div>
    </div>
  </main>
</div>

<script>
(function(){
  var DATA=null, current=0, q="", activeTypes={raw:true,aggregated:true,raw_proxy:true};
  var $=function(s){return document.querySelector(s)};

  // theme toggle
  $("#themeBtn").addEventListener("click",function(){
    var r=document.documentElement;
    var now=r.getAttribute("data-theme");
    var prefersDark=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches;
    if(!now) r.setAttribute("data-theme", prefersDark?"light":"dark");
    else r.setAttribute("data-theme", now==="dark"?"light":"dark");
  });

  // file loading
  var fi=$("#fileInput");
  fi.addEventListener("change",function(e){ if(e.target.files[0]) readFile(e.target.files[0]); });
  var drop=$("#drop");
  if(drop){
    ["dragover","dragenter"].forEach(function(ev){drop.addEventListener(ev,function(e){e.preventDefault();drop.classList.add("over")})});
    ["dragleave","drop"].forEach(function(ev){drop.addEventListener(ev,function(e){e.preventDefault();drop.classList.remove("over")})});
    drop.addEventListener("drop",function(e){ if(e.dataTransfer.files[0]) readFile(e.dataTransfer.files[0]); });
  }
  function readFile(f){
    var r=new FileReader();
    r.onload=function(){
      try{
        var j=JSON.parse(r.result);
        if(!j.crises||!Array.isArray(j.crises)) throw new Error("This JSON has no 'crises' array.");
        DATA=j; current=0; q="";
        $("#fileInfo").textContent = f.name + "  •  " + j.crises.length + " disaster types  •  " + ((j.meta&&j.meta.description)?"loaded":"loaded");
        renderSidebar(); renderMain();
      }catch(err){ alert("Could not read this file:\n"+err.message); }
    };
    r.readAsText(f);
  }

  function macroOf(c){ return c.macro_category||"Other"; }
  function famOf(c){ return c.hazard_family||""; }

  function renderSidebar(){
    var sb=$("#sidebar"); sb.innerHTML="";
    // group by macro, then natural disasters by family
    var groups={};
    DATA.crises.forEach(function(c,i){
      var key=macroOf(c);
      (groups[key]=groups[key]||[]).push(i);
    });
    Object.keys(groups).forEach(function(macro){
      var t=document.createElement("div"); t.className="grp-title"; t.textContent=macro; sb.appendChild(t);
      groups[macro].forEach(function(i){
        var c=DATA.crises[i];
        var b=document.createElement("button");
        b.className="dbtn"+(i===current?" active":"");
        b.innerHTML='<span class="nm">'+esc(c.disaster_type)+(famOf(c)?' <span style="opacity:.6;font-size:11px">· '+esc(c.hazard_family)+'</span>':'')+'</span><span class="cnt">'+c.indicators.length+'</span>';
        b.addEventListener("click",function(){ current=i; q=""; renderSidebar(); renderMain(); window.scrollTo(0,0);});
        sb.appendChild(b);
      });
    });
  }

  function renderMain(){
    var m=$("#main");
    if(!DATA){return;}
    var c=DATA.crises[current];
    var typesPresent={};
    c.indicators.forEach(function(x){typesPresent[x.type]=true;});

    var html='';
    html+='<div class="crumb">'+esc(macroOf(c))+(famOf(c)?' › '+esc(c.hazard_family):'')+'</div>';
    html+='<h2 class="dt">'+esc(c.disaster_type)+'</h2>';
    html+='<div class="badges">';
    html+='<span class="pill">'+c.indicators.length+' indicators</span>';
    html+='<span class="pill">Hazard layer in INFORM: '+(c.inform_hazard_data?'yes':'no')+'</span>';
    html+='</div>';
    if(c.note) html+='<div class="note">'+esc(c.note)+'</div>';

    html+='<div class="toolbar">';
    html+='<input class="search" id="q" placeholder="Search code, name or description…" value="'+esc(q)+'">';
    ["raw","raw_proxy","aggregated"].forEach(function(t){
      if(typesPresent[t]) html+='<span class="chip'+(activeTypes[t]?' on':'')+'" data-t="'+t+'">'+t+'</span>';
    });
    html+='</div>';
    html+='<div class="count-line" id="countLine"></div>';

    html+='<table><thead><tr><th>Code</th><th>Indicator</th><th>Unit</th><th>Type</th></tr></thead><tbody id="rows"></tbody></table>';
    m.innerHTML=html;

    var qi=$("#q");
    qi.addEventListener("input",function(){q=qi.value;renderRows();});
    qi.focus(); qi.setSelectionRange(q.length,q.length);
    Array.prototype.forEach.call(document.querySelectorAll(".chip"),function(ch){
      ch.addEventListener("click",function(){ var t=ch.getAttribute("data-t"); activeTypes[t]=!activeTypes[t]; ch.classList.toggle("on"); renderRows(); });
    });
    renderRows();
  }

  function renderRows(){
    var c=DATA.crises[current];
    var ql=q.trim().toLowerCase();
    var rows=$("#rows"); rows.innerHTML="";
    var shown=0;
    c.indicators.forEach(function(x){
      if(!activeTypes[x.type]) return;
      if(ql){
        var hay=(x.code+" "+x.name+" "+(x.description||"")+" "+(x.inform_group||"")).toLowerCase();
        if(hay.indexOf(ql)<0) return;
      }
      shown++;
      var tr=document.createElement("tr");
      tr.innerHTML=
        '<td><code class="code">'+esc(x.code)+'</code></td>'+
        '<td><div class="nm2">'+esc(x.name)+'</div>'+
          (x.description?'<div class="desc">'+esc(x.description)+'</div>':'')+
          (x.inform_group?'<div class="grp">'+esc(x.inform_group)+'</div>':'')+'</td>'+
        '<td class="unit">'+esc(x.unit||'—')+'</td>'+
        '<td><span class="tag '+x.type+'">'+esc(x.type)+'</span></td>';
      rows.appendChild(tr);
    });
    var cl=$("#countLine");
    if(cl) cl.textContent="Showing "+shown+" of "+c.indicators.length+" indicators";
  }

  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];}); }
})();
</script>
</body>
</html>
